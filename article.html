<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Fanatics Magazine - Submit An Article</title>
    <!-- Bootstrap and CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="article.css">
</head>
<body>

    <!-- navigation bar-->
    <nav>
        <a href="index.html">Home</a> |
        <a href="cart.html">Shopping Cart</a> |
        <a href="ManagePage.html">Manage Products</a>

    </nav>

    <h1>Fashion Fanatics Magazine</h1>

    <!-- Submission Form -->
    <form id="finalForm" class="submission-form">

        <h3>Submit Your Article Here</h3>

        <div class="mb-3">
            <label class="form-label">Article Title *</label>
            <input type="text" id="title" class="form-control" placeholder="Enter article title">
        </div>

        <div class="mb-3">
            <label class="form-label">Author Name *</label>
            <input type="text" id="author" class="form-control" placeholder="Your name">
        </div>

        <div class="mb-3">
            <label class="form-label">Preferred Publication Date *</label>
            <input type="date" id="pubDate" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Article Category *</label>
            <select id="category" class="form-select">
                <option value="">Select Category</option>
                <option>Pop Culture</option>
                <option>Fashion</option>
                <option>Celebrity News</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Review Status *</label>
            <select id="reviewStatus" class="form-select">
                <option value="">Select Status</option>
                <option>Draft</option>
                <option>Submitted for Review</option>
                <option>Approved for Publication</option>
                <option>Published</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Where do you want this article to be published? *</label><br>
            <input type="checkbox" name="channels" value="Website"> Website<br>
            <input type="checkbox" name="channels" value="Print Edition"> Print Edition<br>
            <input type="checkbox" name="channels" value="Social Media"> Social Media
        </div>

        <div class="mb-3">
            <label class="form-label">Editorial Notes</label>
            <textarea id="notes" class="form-control" placeholder="Optional notes for editors..."></textarea>
        </div>

        <div id="errorMsg" class="text-danger mb-3"></div>

        <button type="submit" class="btn btn-dark w-100">Submit Article</button>
    </form>

    <!-- jQuery and JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="article.js"></script>

</body>
</html>
